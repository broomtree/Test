<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 우주 탐험 게임</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: #000;
        }

        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 20, 40, 0.85);
            padding: 20px;
            border-radius: 12px;
            font-size: 14px;
            z-index: 100;
            border: 2px solid rgba(0, 200, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 200, 255, 0.3);
            min-width: 250px;
        }

        #info h2 {
            margin: 0 0 15px 0;
            color: #00ffff;
            font-size: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
        }

        #info p {
            margin: 8px 0;
            line-height: 1.6;
        }

        #info strong {
            color: #00ffff;
        }

        .stat {
            color: #ffaa00;
            font-weight: bold;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ffff;
            font-size: 28px;
            text-align: center;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8);
            z-index: 200;
        }

        .hidden {
            display: none;
        }

        #fps {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="loading">우주 탐험 준비 중...</div>

    <div id="info">
        <h2>🚀 우주 탐험 게임</h2>
        <p><strong>조작법:</strong></p>
        <p>🖱️ 마우스: 시점 회전</p>
        <p>⌨️ W/S: 앞/뒤 이동</p>
        <p>⌨️ A/D: 좌/우 이동</p>
        <p>⌨️ Space/Shift: 위/아래</p>
        <p>⌨️ Q/E: 롤(회전)</p>
        <hr style="margin: 10px 0; border-color: rgba(0, 200, 255, 0.3);">
        <p>📊 속도: <span id="speed" class="stat">0.00</span></p>
        <p>📍 X: <span id="posX" class="stat">0</span></p>
        <p>📍 Y: <span id="posY" class="stat">0</span></p>
        <p>📍 Z: <span id="posZ" class="stat">0</span></p>
        <p>⭐ 천체: <span id="objects" class="stat">0</span></p>
    </div>

    <div id="fps">FPS: <span id="fpsValue">60</span></div>

    <script src="game.js"></script>
</body>
</html>
